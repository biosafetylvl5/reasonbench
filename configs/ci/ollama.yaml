# Self-hosted models for CI. Free, needs no secret, and runs on fork pull
# requests, so the exit-code contract is exercised on every change.
#
# gemma3:270m has no thinking mode, so its reasoning criteria report n/a.
# qwen3:0.6b does, which is what exercises trace extraction against a live
# server rather than a fixture.
version: 1
base_url: http://localhost:11434/v1

models:
  - gemma3:270m
  - qwen3:0.6b

sweep:
  repeats: 1
  temperature: [0.0]
  reasoning_effort: [null]

max_tokens: 256
max_concurrency: 2
max_retries: 2
timeout_s: 120
budget_usd: 1.00
max_samples: 40
# Ollama reports no usage.cost, so budget_usd alone would not bound anything.
# Self-hosted generation really is free, so say so and let the token cap bound
# the run.
pricing:
  per_mtok:
    "*": {prompt: 0.0, completion: 0.0}
max_total_tokens: 200000

judge:
  model: qwen3:0.6b
  temperature: 0.0
  repeats: 1
  blind: true
  max_chars: 4000
  parse_retries: 1
