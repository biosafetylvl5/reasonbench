stages: [check, test]

default:
  image: python:3.12-slim
  cache:
    key: "$CI_JOB_NAME-$CI_JOB_IMAGE"
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  before_script:
    - pip install --quiet -e ".[dev]"

lint:
  stage: check
  script:
    - ruff check src tests
    - ruff format --check src tests
    - mypy src

test:
  stage: test
  parallel:
    matrix:
      - PY: ["3.11", "3.12", "3.13"]
  image: python:$PY-slim
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# The shipped template, exercised by the project that ships it.
dogfood:
  stage: test
  script:
    - reasonbench run configs/models.yaml configs/prompts/mcq-dataset.yaml --dry-run
    - reasonbench --version
